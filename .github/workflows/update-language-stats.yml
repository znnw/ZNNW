name: Update language statistics

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/generate-language-stats.mjs"
      - ".github/workflows/update-language-stats.yml"

permissions:
  contents: write

concurrency:
  group: language-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate language statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ZNNW
          EXCLUDE_REPOS: Frontend-learning-lab,js-browser-engineering-lab
          LANGS_COUNT: 12
          SIZE_WEIGHT: 0.5
          COUNT_WEIGHT: 0.5
          FEATURED_TECH: Spring Cloud,Spring AI,Vue,React,LangChain
          LANGUAGE_WEIGHTS: JavaScript:0.6
          EXCLUDE_LANGUAGES: "C++"
          OUTPUT: assets/top-langs.svg
        run: node .github/scripts/generate-language-stats.mjs

      - name: Commit updated statistics
        run: |
          git add -- assets/top-langs.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update language statistics"
          git push
